<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sama Architect · Simulador Interactivo 3D</title>
  <meta name="description" content="Simulador arquitectónico 3D interactivo: cinco arquitectos construyen casas, edificios, hoteles de lujo y restaurantes con ecuaciones lineales, cuadráticas y decimales en tiempo real.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== CAPA 1 · Barra superior ===== -->
  <header id="barra-superior">
    <div class="marca">
      <span class="logo" aria-hidden="true">▲</span>
      <div>
        <h1>SAMA ARCHITECT</h1>
        <p>Simulador Interactivo 3D · Diseño paramétrico</p>
      </div>
    </div>

    <div class="controles-globales">
      <label class="hora" title="Hora del día (iluminación bioclimática)">
        <span id="icono-hora" aria-hidden="true">☀️</span>
        <input type="range" id="hora" min="0" max="24" step="0.05" value="15.3" aria-label="Hora del día">
        <output id="hora-txt">15:18</output>
      </label>
      <button class="btn" id="btn-general" type="button">🌍 Vista general</button>
      <button class="btn" id="btn-tour" type="button">🎥 Recorrido</button>
      <button class="btn" id="btn-explosion" type="button">💥 Explosionar</button>
      <button class="btn solo-movil" id="btn-panel-control" type="button">✏️ Diseño</button>
      <button class="btn solo-movil" id="btn-panel-metricas" type="button">📊 Métricas</button>
    </div>
  </header>

  <!-- ===== CAPA 2 · Escenario: canvas 3D + paneles modulares ===== -->
  <main id="escenario">

    <section id="vista3d" aria-label="Escena tridimensional">
      <canvas id="lienzo3d"></canvas>

      <div id="hud">
        <div id="hud-info"></div>
        <div id="ayuda">Arrastra para orbitar · Rueda/pellizco para zoom · Toca un lote para elegir arquitecto</div>
      </div>

      <div id="avisos" aria-live="polite"></div>

      <div id="cargando">
        <div class="spinner"></div>
        <p>Preparando el estudio de arquitectura...</p>
      </div>
    </section>

    <!-- Panel lateral izquierdo: control de variables de entrada -->
    <aside id="panel-control" class="panel" aria-label="Controles del arquitecto">
      <h2 id="ctl-titulo">Arquitecto</h2>
      <p id="ctl-estilo" class="suave"></p>

      <details open>
        <summary>1 · Tipo de edificación</summary>
        <div id="tipos" class="rejilla-tipos"></div>
      </details>

      <details open>
        <summary>2 · Lote y ecuación cuadrática</summary>
        <label class="campo">Perímetro disponible P
          <span class="fila"><input type="range" id="in-P" min="28" max="100" step="0.5"><output id="out-P"></output></span>
        </label>
        <label class="campo">Ancho del lote construido x
          <span class="fila"><input type="range" id="in-x" min="4" max="30" step="0.05"><output id="out-x"></output></span>
        </label>
        <button class="btn pequeno" id="btn-optimo" type="button">★ Llevar x al área máxima (x = b/2)</button>
        <p id="eq-cuad" class="ecuacion"></p>
      </details>
