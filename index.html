<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMA ARQ V3 Final</title>
<link rel="stylesheet" href="style.css">
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <div class="header"><h1>SAMA <span>ARQ</span></h1><p>Simulador Parametrico v3</p><div class="stats"><div><span id="areaVal">0</span> m2</div><div><span id="costoVal">0</span> COP</div><div><span id="volVal">0</span> m3</div></div></div>
  <div class="controls">
    <label>Estilo:</label>
    <select id="estilo"><option value="aleja">1. ALEJA - Industrial [2.85m]</option><option value="andres" selected>2. ANDRES - Cuadratica</option><option value="diana">3. DIANA - Lineal</option><option value="alfred">4. ALFRED - Volumen</option><option value="diego">5. DIEGO - Arco</option></select>
    <div class="sliders">
      <div class="sl"><span>Ancho Lote (b)</span><input type="range" id="b" min="20" max="120" value="60"><b id="bLabel">60</b></div>
      <div class="sl"><span>Profundidad (x)</span><input type="range" id="x" min="5" max="60" value="30"><b id="xLabel">30</b></div>
      <div class="sl"><span>Pisos</span><input type="range" id="pisos" min="1" max="8" value="2"><b id="pisosLabel">2</b></div>
    </div>
    <div id="extraControls"></div>
    <div class="logBox"><h3>Log Matematico</h3><div id="log">Cargando...</div></div>
  </div>
  <div class="footer">Three.js 2026 - Drag orbitar, scroll zoom</div>
</div>
<div id="canvas-container"></div>
<script type="module" src="main.js"></script>
</body>
</html>
